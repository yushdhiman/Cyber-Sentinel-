version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-sentinel-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=sentinel-docker-prod-secret-key-987654321
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - sentinel-data:/app/src/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber-sentinel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sentinel-data:
